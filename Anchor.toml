[toolchain]
anchor_version = "1.0.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
payroll_program = "BMCyG8PxXGVED95NGmYZLKT1jTPmjmGWpRPtLtqaB4EV"
tax_vault_program = "CwUy1nfdAQAHTXM1ehmRhdjeHdECBUSRJadHACeKXJo5"

[provider]
